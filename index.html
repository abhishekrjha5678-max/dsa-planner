<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA in 24 weeks — Java planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>DSA in 24 weeks</h1>
  <p class="sub">Java · Striver videos · 5 days a week · about 2 hours a day</p>
  <div class="bar" role="progressbar" aria-label="Overall progress"><i id="bar"></i></div>
  <p id="stats" class="stats"></p>
  <div class="tools">
    <label>Start date (a Monday) <input type="date" id="start"></label>
    <button id="jump">Go to this week</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <button id="reset" class="danger">Reset</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>
<main id="weeks"></main>
<footer>Progress is saved in this browser. Use Export to back it up or move it to another device.</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
